<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Gochi+Hand&family=Great+Vibes&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbe9ee;--ink:#5a2b3c;--accent:#ff639b;--shadow:rgba(120,40,70,.28);--cream:#f6f2e7;--lt:#151010;--red:#7a0f14;--btn:#e9e6e4;--glass:rgba(255,255,255,.28);--gb:rgba(255,255,255,.65);--gink:#4a1530;--hd:#b0124f;--veil:rgba(255,255,255,0);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--ink:#f6dbe5;--shadow:rgba(0,0,0,.55);--cream:#2a1d1f;--lt:#f6e8e0;--red:#ff8a8f;--btn:#4a3236;--glass:rgba(40,14,28,.4);--gb:rgba(255,255,255,.22);--gink:#ffe6f0;--hd:#ff8fbd;--veil:rgba(20,6,14,.55)}}
:root[data-theme="dark"]{--bg:#2a1620;--ink:#f6dbe5;--shadow:rgba(0,0,0,.55);--cream:#2a1d1f;--lt:#f6e8e0;--red:#ff8a8f;--btn:#4a3236;--glass:rgba(40,14,28,.4);--gb:rgba(255,255,255,.22);--gink:#ffe6f0;--hd:#ff8fbd;--veil:rgba(20,6,14,.55)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
body.lock{overflow:hidden}
/* landing */
#landing{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));transition:opacity .9s,filter .9s,transform .9s}
#landing.out{opacity:0;filter:blur(18px);transform:scale(1.06);pointer-events:none}
.rv{opacity:0;animation:up 1s ease-out calc(var(--i)*.28s + .2s) both}
@keyframes up{from{opacity:0;filter:blur(12px);transform:translateY(16px)}to{opacity:1;filter:none;transform:none}}
.cat{width:70px;height:90px;animation:up 1s ease-out .2s both,bob 2.4s ease-in-out 1.2s infinite}
@keyframes bob{50%{translate:0 -7px}}
h1{font:400 clamp(3.2rem,12vw,5.4rem)/1 'Caveat Brush','Gochi Hand',cursive;color:var(--lt);margin:8px 0 0}
.nm{font:400 clamp(2.5rem,9vw,3.8rem)/1 'Caveat Brush',cursive;color:var(--red);margin:8px 0 22px}
.sub{font:400 1.3rem 'Gochi Hand',cursive;color:var(--lt);opacity:.7;margin:0 0 18px}
.row{display:flex;gap:14px;justify-content:center}
.pill{font:700 .95rem system-ui,sans-serif;letter-spacing:.09em;color:var(--lt);background:var(--btn);border:4px solid var(--red);border-radius:999px;padding:14px 8px;width:clamp(140px,38vw,200px);cursor:pointer;transition:transform .3s,box-shadow .3s,scale .4s}
.pill:hover{transform:translateY(-4px);box-shadow:0 10px 20px var(--shadow)}
.shake{animation:shake .45s}
@keyframes shake{25%{translate:-8px 0}75%{translate:8px 0}}
.fl{position:absolute;top:50%;width:clamp(110px,19vw,230px);margin-top:-12%;transform-origin:50% 100%;animation:blurIn 1.6s ease-out .4s both,sway 5s ease-in-out 2s infinite;pointer-events:none}
.fl.l{left:5vw}.fl.r{right:5vw;animation-delay:.7s,2.5s}
@keyframes sway{50%{rotate:3deg}}
@media (max-width:600px){.fl{top:auto;bottom:3%;margin:0;width:36vw}.fl.l{left:-7vw}.fl.r{right:-7vw}}
/* main */
#main{display:none}#main.in{display:block}
.backdrop{position:fixed;inset:0;z-index:-1;background:var(--hb) center/cover}
.backdrop::after{content:"";position:absolute;inset:0;background:var(--veil)}
.hero{width:100vw;height:100svh;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30px;background:var(--hb) center/cover;filter:blur(16px)}
.cue{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:10;color:#fff;font:700 1.15rem 'Dancing Script',cursive;text-shadow:0 1px 6px rgba(120,30,70,.8);animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.stage{position:relative;width:min(100vw,calc(100svh*1280/2276));aspect-ratio:1280/2276;overflow:hidden;box-shadow:0 0 60px var(--shadow);background:#f8dfe6;touch-action:pan-y}
.p{position:absolute;inset:0;transform:translate(calc(var(--mx,0)*var(--d,0)*1px),calc(var(--my,0)*var(--d,0)*1px));transition:transform .25s ease-out,scale .45s cubic-bezier(.3,1.6,.5,1),rotate .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.p img{position:absolute;inset:0;width:100%;height:100%;opacity:0;display:block;user-select:none}
.p.hov{scale:1.05;rotate:-1.5deg}
.p.hov.t{filter:drop-shadow(0 6px 10px rgba(255,99,155,.45))}
.p[data-k="photo"]{z-index:1}.p[data-k="tg"]{z-index:2}
.hot{position:absolute;z-index:5;cursor:pointer}
.go .bg{animation:blurIn 1.4s ease-out both}
.go .happy{animation:txt 1.3s ease-out .3s both}
.go .bday{animation:txt 1.3s ease-out .7s both}
.go .photo{animation:blurIn 1.3s ease-out 1s both,float 5s ease-in-out 2.6s infinite}
.go .tg{animation:txt 1.3s ease-out 1.3s both}
.go .you{animation:txt 1.4s ease-out 1.7s both}
@keyframes blurIn{from{opacity:0;filter:blur(22px);transform:scale(1.08)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes txt{from{opacity:0;filter:blur(14px);clip-path:inset(0 100% 0 0)}55%{clip-path:inset(0 0 0 0)}to{opacity:1;filter:blur(0);clip-path:inset(0 0 0 0)}}
@keyframes float{50%{translate:0 -10px}}
/* wish */
.wsec{height:150svh;position:relative}
.sticky{position:sticky;top:0;height:100svh;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px}
.gcard{width:min(94vw,580px);padding:clamp(22px,6vw,40px);border-radius:28px;background:var(--glass);border:1px solid var(--gb);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 20px 50px var(--shadow),inset 0 1px 0 rgba(255,255,255,.55);color:var(--gink);font:400 clamp(1.45rem,5.6vw,1.95rem)/1.3 'Great Vibes','Dancing Script',cursive;text-align:center}
.gcard h2{font:inherit;font-size:1.45em;margin:0 0 .25em;color:var(--hd)}
.gcard p{margin:0 0 .55em}
.sig{color:var(--hd);font-size:1.3em}
.w{display:inline-block;opacity:.2;filter:blur(4px);transform:translateY(8px);transition:opacity .6s,filter .6s,transform .6s}
.w.on{opacity:1;filter:none;transform:none}
.w.on:hover{color:var(--hd);transform:translateY(-3px) scale(1.1)}
@media (prefers-reduced-motion:reduce){.rv,.cat,.fl,.go .bg,.go .happy,.go .bday,.go .tg,.go .photo,.go .you{animation-duration:.01s!important;animation-delay:0s!important}.w{transition:none}}
</style></head>

const $=id=>document.getElementById(id),stage=$('stage'),land=$('landing'),main=$('main');

function start(){stage.classList.remove('go');void stage.offsetWidth;stage.classList.add('go')}
function enter(){land.classList.add('out');main.classList.add('in');document.body.classList.remove('lock');scrollTo(0,0);start();sc();setTimeout(()=>land.remove(),1000)}

function move(e){const r=stage.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
